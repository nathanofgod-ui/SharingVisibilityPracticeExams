    <body>
        <div class="wrap">

            <div class="masthead">
                <div class="masthead-top">
                    <span class="eyebrow">Sharing and Visibility Architect · Review Queue</span>
                    <div class="exam-guide-links">
                        <a class="exam-guide-link exam-guide-link--brand" href="https://help.salesforce.com/s/articleView?id=005298977&type=1" target="_blank" rel="noopener noreferrer">Exam Guide ↗</a>
                    </div>
                </div>
                <h1>Sharing and Visibility Architect</h1>
                <p>Practice questions for the Salesforce Certified Sharing and Visibility Architect exam. Work each ticket, check your answer, then read the explanation and its sources.</p>
            </div>

            <div class="section-picker" id="sectionPicker">
                <label class="section-picker-label mono" for="sectionSelect">Practice section</label>
                    <select class="section-picker-select mono" id="sectionSelect"></select>
                <label class="sw-toggle" for="shuffleToggle" title="Shuffle the question order">
                    <span class="sw-toggle-label mono">Shuffle</span>
                    <input type="checkbox" class="sw-toggle-input" id="shuffleToggle" role="switch" checked>
                    <span class="sw-toggle-track" aria-hidden="true"><span class="sw-toggle-knob"></span></span>
                    <span class="sw-toggle-state mono" id="shuffleToggleState" aria-hidden="true">On</span>
                </label>
            </div>

            <div class="stats" id="stats"></div>
            <div class="queue" id="queue"></div>

            <div class="ticket" id="ticket">
                <div class="perf"></div>
                <!-- rendered by JS -->
            </div>

            <div id="shift"></div>

            <footer>
                <span class="mono" id="ticketCount"></span>
                <div class="footer-actions">
                <div class="export-menu" id="exportMenu">
                    <button type="button" class="btn ghost" id="exportBtn" style="padding:7px 14px; font-size:13px;" aria-haspopup="true" aria-expanded="false">Export ▾</button>
                    <div class="export-menu-list" id="exportMenuList" role="menu" hidden>
                    <button type="button" class="export-menu-item" id="exportPdfBtn" role="menuitem">Export as PDF</button>
                    <button type="button" class="export-menu-item" id="exportWordBtn" role="menuitem">Export as Word (.docx)</button>
                    </div>
                </div>
                <button class="btn ghost" id="resetAll" style="padding:7px 14px; font-size:13px;">Reset all tickets</button>
                </div>
            </footer>

            <div id="printExport" class="print-export"></div>
        </div>
    <script src="script.js"></script>
    </body>
</html>
